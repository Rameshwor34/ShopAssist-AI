services:

  backend:
    build: .
    container_name: shopassist-backend
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      LOCAL_LLM_BASE_URL: http://vllm:8000/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen/Qwen3-0.6B}
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: .
    container_name: shopassist-frontend
    env_file:
      - .env
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    container_name: shopassist-vllm
    profiles:
      - local-llm
    command:
      - "--model"
      - "${LOCAL_LLM_MODEL:-Qwen/Qwen3-0.6B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8002:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

